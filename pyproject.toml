[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midibrain"
version = "0.1.0"
description = "Performance-first MIDI middleware prototype for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3.2",
  "python-rtmidi>=1.5.8",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28.1", "httpx2"]

[project.scripts]
midibrain = "midibrain.cli:main"
midibrain-web = "midibrain.webapp:main"
midibrain-mixer = "midibrain.performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"midibrain.performance" = ["*.js", "*.mjs", "*.css", "*.html", "presets/*.csv", "presets/*.json", "presets/*.txt", "presets/*.md", "manual/*.md", "manual/*.json"]
